<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>canopyOS</title>
    <!-- Import Fira Code from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: rgb(25, 25, 25);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Fira Code', monospace;
            color: #d4d4d4;
        }

        /* Canvas for floating dots background */
        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Centered title - Regular font weight, non-bold */
        h1 {
            position: relative;
            z-index: 2;
            color: #ffffff;
            font-size: 4rem;
            font-weight: 400;
            letter-spacing: -0.02em;
            user-select: none;
            cursor: default;
        }

        @media (max-width: 640px) {
            h1 {
                font-size: 2.5rem;
            }
        }

        /* Minimal Floating Bottom Bar with Controller */
        .floating-bar {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 18px;
            background: rgba(35, 35, 35, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: all 0.25 ease;
            cursor: pointer;
        }

        .floating-bar:hover {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(45, 45, 45, 0.85);
            transform: translateX(-50%) translateY(-2px);
            box-shadow: 0 14px 35px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        /* Controller Vector Icon */
        .controller-icon {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #a0a0a0;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.2s ease;
        }

        .floating-bar:hover .controller-icon {
            stroke: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Particle canvas overlay -->
    <canvas id="particle-canvas"></canvas>

    <!-- Centered text -->
    <h1>canopyOS</h1>

    <!-- Minimal Floating Bottom Bar with Controller -->
    <div class="floating-bar" id="game-controller-btn" role="button" aria-label="Go to Games">
        <svg class="controller-icon" viewBox="0 0 24 24">
            <!-- Gamepad / Controller Silhouette & Details -->
            <path d="M6 11h4M8 9v4M15 10.5h.01M17 12.5h.01" />
            <path d="M17.25 18a2.25 2.25 0 0 1-2.086-1.402l-.6-1.4a1 1 0 0 0-.922-.602h-3.284a1 1 0 0 0-.922.602l-.6 1.4A2.25 2.25 0 0 1 6.75 18 3.75 3.75 0 0 1 3 14.25V11a5 5 0 0 1 5-5h8a5 5 0 0 1 5 5v3.25A3.75 3.75 0 0 1 17.25 18z" />
        </svg>
    </div>

    <script>
        // Redirect to games.html on controller button click
        document.getElementById('game-controller-btn').addEventListener('click', () => {
            window.location.href = 'games.html';
        });

        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');

        let width = 0;
        let height = 0;
        let particles = [];

        // Constants
        const PARTICLE_COUNT = 60;
        const PARTICLE_COLOR = 'rgb(51, 51, 51)';
        const LINE_COLOR_BASE = '51, 51, 51';
        const SPEED_MULTIPLIER = 0.1;
        const MOUSE_RADIUS = 150;

        // Mouse tracking
        const mouse = {
            x: null,
            y: null
        };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mouseleave', () => {
            mouse.x = null;
            mouse.y = null;
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
            }
        }, { passive: true });

        window.addEventListener('touchend', () => {
            mouse.x = null;
            mouse.y = null;
        });

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles();
        }

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.radius = Math.random() * 1.5 + 1.2;
                this.angle = Math.random() * Math.PI * 2;
                this.baseSpeed = Math.random() * 1.0 + 0.5;
            }

            update() {
                const currentSpeed = this.baseSpeed * SPEED_MULTIPLIER;
                this.x += Math.cos(this.angle) * currentSpeed;
                this.y += Math.sin(this.angle) * currentSpeed;

                if (this.x < -10) this.x = width + 10;
                if (this.x > width + 10) this.x = -10;
                if (this.y < -10) this.y = height + 10;
                if (this.y > height + 10) this.y = -10;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = PARTICLE_COLOR;
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push(new Particle());
            }
        }

        function connectParticles() {
            if (mouse.x === null || mouse.y === null) return;

            const nearParticles = [];
            for (let i = 0; i < particles.length; i++) {
                const dx = particles[i].x - mouse.x;
                const dy = particles[i].y - mouse.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < MOUSE_RADIUS) {
                    nearParticles.push({
                        particle: particles[i],
                        dist: dist
                    });
                }
            }

            for (let i = 0; i < nearParticles.length; i++) {
                const pA = nearParticles[i].particle;
                const distToMouse = nearParticles[i].dist;
                const mouseAlpha = (1 - distToMouse / MOUSE_RADIUS) * 0.8;

                ctx.beginPath();
                ctx.moveTo(pA.x, pA.y);
                ctx.lineTo(mouse.x, mouse.y);
                ctx.strokeStyle = `rgba(${LINE_COLOR_BASE}, ${mouseAlpha})`;
                ctx.lineWidth = 0.8;
                ctx.stroke();

                for (let j = i + 1; j < nearParticles.length; j++) {
                    const pB = nearParticles[j].particle;
                    const pdx = pA.x - pB.x;
                    const pdy = pA.y - pB.y;
                    const pDist = Math.sqrt(pdx * pdx + pdy * pdy);

                    if (pDist < MOUSE_RADIUS * 0.8) {
                        const interAlpha = (1 - pDist / (MOUSE_RADIUS * 0.8)) * mouseAlpha;
                        ctx.beginPath();
                        ctx.moveTo(pA.x, pA.y);
                        ctx.lineTo(pB.x, pB.y);
                        ctx.strokeStyle = `rgba(${LINE_COLOR_BASE}, ${interAlpha})`;
                        ctx.lineWidth = 0.6;
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }

            connectParticles();
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);

        window.onload = function() {
            resize();
            animate();
        };
    </script>
</body>
</html>
